version: '3.8'

services:
  web:
    build: .
    ports:
      - "30005:80"
    volumes:
      - ./src:/var/www/html
    depends_on:
      - db

  db:
    image: mysql:5.7
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: hxh_db
    volumes:
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
